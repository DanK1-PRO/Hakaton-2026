name: Quality and integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dds
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dds
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dds"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://dds:ci-only-password@localhost:5432/dds
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      DEMO_PASSWORD: DdsDemo2026!
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend ml scripts
      - run: pytest -q
      - run: alembic -c backend/alembic.ini upgrade head
      - run: python -m app.seed
      - name: Local evaluator and failure contract
        run: python scripts/verify_local_ml.py
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser integration
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/dds-api.log 2>&1 &
          cd frontend
          npm run dev > /tmp/dds-ui.log 2>&1 &
          npx wait-on --timeout 120000 http-get://127.0.0.1:5173 http-get://127.0.0.1:8000/health
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compose smoke
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
        run: |
          docker compose up -d --build --wait
          curl --fail http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/health
          docker compose down
